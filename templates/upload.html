<!DOCTYPE html>
<html>
<head>
  <title>Upload Authorized User</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-dark text-light">
  <div class="container mt-5">
    <h2>Register Authorized User</h2>
    <form method="post" enctype="multipart/form-data">
      <input type="text" name="name" class="form-control my-2" placeholder="Enter Name" required>
      <input type="file" name="file" class="form-control my-2" accept="image/*" required>
      <button type="submit" class="btn btn-success">Upload</button>
    </form>
    <a href="/" class="btn btn-secondary mt-3">Back</a>
  </div>
</body>
</html>
